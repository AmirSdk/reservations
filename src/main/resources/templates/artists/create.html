
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Ajouter un artiste</title>
</head>
<body>

<h1>Ajouter un artiste</h1>

<form th:action="@{/artists}" th:object="${artist}" method="post">

  <div>
    <label for="firstname">Prénom :</label>
    <input type="text"
           id="firstname"
           th:field="*{firstname}"
           required>
  </div>

  <div>
    <label for="lastname">Nom :</label>
    <input type="text"
           id="lastname"
           th:field="*{lastname}"
           required>
  </div>

  <button type="submit">Enregistrer</button>

</form>

<p>
  <a th:href="@{/artists}">Retour à la liste</a>
</p>

</body>
</html>
